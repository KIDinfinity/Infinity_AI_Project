[project]
name = "fund"
version = "0.0.0"
description = "短线基金 AI 分析决策系统（个人 side project，非 DA-01）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.scripts]
fund = "fund.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fund"]

[dependency-groups]
dev = [
    "pytest>=8",
]
